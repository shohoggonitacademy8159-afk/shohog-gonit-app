name: অ্যাপ তৈরি (APK ও ওয়েব)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK তৈরি
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: চাবির পাসওয়ার্ড আছে কিনা দেখা
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEYSTORE_PASSWORD নামের Secret যোগ করা হয়নি। Settings > Secrets and variables > Actions থেকে যোগ করুন।"
            exit 1
          fi

      # সই করার চাবি রিপোতে রাখা হয় না: KEYSTORE_B64 Secret (base64) থেকে বিল্ডের সময় তৈরি হয়, কাজ শেষে মুছে যায়
      - name: সই করার চাবি প্রস্তুত
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p signing
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > signing/sohog-release.p12
            echo "চাবি Secret থেকে নেওয়া হয়েছে"
          elif [ -f signing/sohog-release.p12 ]; then
            echo "::warning::KEYSTORE_B64 Secret নেই — রিপোর ফাইল ব্যবহার হচ্ছে। Secret যোগ করে রিপো থেকে ফাইলটি সরান।"
          else
            echo "::error::KEYSTORE_B64 নামের Secret যোগ করা হয়নি। Settings > Secrets and variables > Actions থেকে যোগ করুন।"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: ওয়েব অংশ তৈরি
        run: |
          npm ci
          npm run build
          FP=$(bash scripts/native-fp.sh); echo "নেটিভ আঙুলছাপ: $FP"
          echo "window.SOHOG_BUILD=${{ github.run_number }};window.SOHOG_NATIVE='$FP';" > www/build.js
          npx cap sync android

      - name: APK তৈরি ও সই
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log; then
            msg=$( (grep -A25 "What went wrong" build.log || tail -60 build.log) | head -60 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=APK build failed::$msg"
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk ../sohog-ganit-academy.apk

      - name: APK সংরক্ষণ
        uses: actions/upload-artifact@v4
        with:
          name: sohog-ganit-academy-apk
          path: sohog-ganit-academy.apk

      - name: Releases-এ প্রকাশ
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: সহগ গণিত একাডেমি ১.০.${{ github.run_number }}
          body: শিক্ষার্থীদের পাঠানোর জন্য নিচের sohog-ganit-academy.apk ফাইলটি ডাউনলোড করুন।
          files: sohog-ganit-academy.apk
          make_latest: true

  web:
    name: ওয়েব সংস্করণ (পিসি থেকে অ্যাডমিনের জন্য)
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          npm ci
          npm run build
      - name: এক চাপে আপডেটের বান্ডেল (OTA, pdf/ ছাড়া)
        run: |
          N=${{ github.run_number }}; FP=$(bash scripts/native-fp.sh); echo "নেটিভ আঙুলছাপ: $FP"
          rm -f www/_prev.html; rm -rf www/ota
          B=$RUNNER_TEMP/ota; rm -rf "$B"; cp -r www "$B"; rm -rf "$B/pdf"
          echo "window.SOHOG_BUILD=$N;window.SOHOG_NATIVE='$FP';window.SOHOG_OTA=1;" > "$B/build.js"
          mkdir -p www/ota; (cd "$B" && zip -qr9 "$GITHUB_WORKSPACE/www/ota/b$N.zip" .)
          SUM=$(sha256sum "www/ota/b$N.zip" | cut -d' ' -f1)
          printf '{"build":%s,"native":"%s","url":"https://shohoggonitacademy8159-afk.github.io/shohog-gonit-app/ota/b%s.zip","sha256":"%s"}\n' "$N" "$FP" "$N" "$SUM" > www/ota/latest.json
          cat www/ota/latest.json; ls -la www/ota
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4
