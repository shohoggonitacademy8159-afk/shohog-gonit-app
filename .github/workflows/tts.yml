name: ভয়েস তৈরি (অস্থায়ী)
on:
  push:
    branches: [voice-tmp]
permissions:
  contents: write
jobs:
  tts:
    if: "!contains(github.event.head_commit.message, '[out]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install edge-tts
      - run: |
          mkdir -p out
          for V in bn-BD-NabanitaNeural bn-IN-TanishaaNeural; do
            i=0
            while IFS= read -r l; do i=$((i+1)); edge-tts --voice $V --rate=-4% --text "$l" --write-media out/${V}_$i.mp3; done < lines.txt
          done
          ls -la out
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add out; git commit -m "voice [out]"; git push
