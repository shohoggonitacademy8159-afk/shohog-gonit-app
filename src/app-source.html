<title>সহগ গণিত একাডেমি</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Tiro+Bangla&display=swap">
<style>
/* Layout: one phone-width app column; screens swap in place; tab bar pinned to the bottom edge */
:root{
  --bg:#F2F7FD; --surface:#FFFFFF; --fg:#10233F; --muted:#4A5B73; --line:#D6E3F3;
  --accent:#1F5FBF; --accent-ink:#FFFFFF; --accent-soft:#E6EFFB;
  --amber-soft:#FDF0DF; --amber:#9A520A; --teal-soft:#E0F3F1; --teal:#0B6B63;
  --violet-soft:#ECE7FA; --violet:#5B3FC4; --good:#1F7A4D; --good-soft:#E2F4EA; --bad:#B42318; --bad-soft:#FDE8E6;
  --font-display:'Tiro Bangla','Hind Siliguri',serif;
  --font-body:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1726; --surface:#162236; --fg:#E7EEF8; --muted:#A3B3C9; --line:#26354D;
  --accent:#7FAEF5; --accent-ink:#0B1A33; --accent-soft:#1D3152;
  --amber-soft:#3A2A14; --amber:#F2B66B; --teal-soft:#123532; --teal:#6BD1C4;
  --violet-soft:#2A2350; --violet:#B7A6F5; --good:#6FD39A; --good-soft:#163A28; --bad:#F59A90; --bad-soft:#3F1D1A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1726; --surface:#162236; --fg:#E7EEF8; --muted:#A3B3C9; --line:#26354D;
  --accent:#7FAEF5; --accent-ink:#0B1A33; --accent-soft:#1D3152;
  --amber-soft:#3A2A14; --amber:#F2B66B; --teal-soft:#123532; --teal:#6BD1C4;
  --violet-soft:#2A2350; --violet:#B7A6F5; --good:#6FD39A; --good-soft:#163A28; --bad:#F59A90; --bad-soft:#3F1D1A;
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.5}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{flex:1;display:flex;flex-direction:column;gap:18px;padding-block:16px 110px}
.screen.auth{padding-block:56px 32px}
.au-tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.au-tab{border:0;background:transparent;border-radius:10px;padding:10px;font:inherit;font-weight:700;color:var(--muted);cursor:pointer;transition:background .25s,color .25s}
.au-tab.on{background:var(--accent);color:#fff;box-shadow:0 4px 12px -4px var(--accent)}
.au-form{display:flex;flex-direction:column;gap:12px;animation:ddin .3s ease}
.au-pw{position:relative}
.au-pw .input{padding-right:64px}
.au-pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--accent);font:inherit;font-weight:700;cursor:pointer;padding:6px}
.au-ok{background:#E6F7EC;border:1.5px solid #BFE8CD;color:#14632f;border-radius:12px;padding:10px 12px}
.acct-card{display:flex;gap:12px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px}
.acct-card .s{color:var(--muted);font-size:13.5px;word-break:break-all}
h1,h2,h3{margin:0;text-wrap:balance}
.display{font-family:var(--font-display);font-weight:400}
.muted{color:var(--muted)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px}
.topbar h1{font-family:var(--font-display);font-size:22px;font-weight:400}
.iconbtn{width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--fg)}
.iconbtn:hover{background:var(--accent-soft)}
.logo{width:84px;height:84px;border-radius:24px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--accent)}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-weight:600;font-size:15px}
.input{height:56px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:0 18px;font-size:17px}
.input:focus{border-color:var(--accent);outline:none}
.otp{letter-spacing:.6em;text-align:center;font-size:24px;font-variant-numeric:tabular-nums}
.btn{height:54px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-size:17px;font-weight:600;cursor:pointer;padding:0 20px}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:6px;min-height:44px}
.error{color:var(--bad);font-size:14px;min-height:21px}
.note{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.symbols{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 24px;font-size:26px;font-weight:600;color:var(--line);margin-top:auto;padding-top:24px;user-select:none}
.challenge{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:16px;display:flex;align-items:center;gap:14px}
.challenge .bar{height:8px;border-radius:4px;background:color-mix(in srgb,var(--accent-ink) 28%,transparent);margin:8px 0 4px}
.challenge .bar i{display:block;height:100%;border-radius:4px;background:var(--accent-ink)}
.challenge .go{background:var(--accent-ink);color:var(--accent);border:0;border-radius:12px;height:44px;padding:0 16px;font-weight:600;cursor:pointer;white-space:nowrap}
.section{display:flex;flex-direction:column;gap:10px}
.section h2{font-size:17px;font-weight:700}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g1{grid-template-columns:minmax(0,1fr)}
.pay-lock{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:12px;background:var(--pink-bg);border:1.5px solid var(--pink-b);font-size:13.5px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;cursor:pointer;color:var(--fg);font-size:13.5px;font-weight:600;line-height:1.3;min-height:100px}
.tile.row{flex-direction:row;text-align:left;padding:12px;min-height:72px}
.tile:hover{border-color:var(--accent)}
.ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
.ic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.c-blue{background:var(--accent-soft);color:var(--accent)}.c-amber{background:var(--amber-soft);color:var(--amber)}
.c-teal{background:var(--teal-soft);color:var(--teal)}.c-violet{background:var(--violet-soft);color:var(--violet)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;min-height:60px;width:100%}
.item:first-child{border-top:0}
.item:hover{background:var(--accent-soft)}
.num{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:14px;flex-shrink:0;font-variant-numeric:tabular-nums}
.item .t{flex:1;min-width:0;font-weight:600}
.item .s{font-size:13px;color:var(--muted);font-weight:400}
.pill{font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap}
.pill.done{background:var(--good-soft);color:var(--good)}
.pill.todo{background:var(--accent-soft);color:var(--accent)}
.q-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}
.q-head{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.q-text{font-size:21px;font-weight:600;line-height:1.4}
.mx{display:inline-flex;align-items:stretch;vertical-align:middle;margin:3px 4px;line-height:1.3;font-weight:inherit}
.mx::before,.mx::after{content:'';flex:0 0 auto;border:1.6px solid currentColor}
.mx-m::before{width:5px;border-right:0}.mx-m::after{width:5px;border-left:0}
.mx-d::before{border-width:0 0 0 1.6px}.mx-d::after{border-width:0 1.6px 0 0}
.mx-g{display:inline-grid;column-gap:1em;row-gap:1px;padding:1px 7px;justify-items:center;align-items:center;white-space:nowrap}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:10px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;text-align:left;font-size:17px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt .k{width:28px;height:28px;border-radius:8px;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:14px;flex-shrink:0}
.feedback{font-size:15px;padding:10px 14px;border-radius:12px}
.feedback.ok{background:var(--good-soft);color:var(--good)}
.feedback.no{background:var(--bad-soft);color:var(--bad)}
.progress{height:6px;border-radius:3px;background:var(--line)}
.progress i{display:block;height:100%;border-radius:3px;background:var(--accent);transition:width .3s}
.zone{border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px}
.zone h2{font-size:16px}
.z1{background:var(--good-soft)}.z1 h2{color:var(--good)}
.z2{background:var(--accent-soft)}.z2 h2{color:var(--accent)}
.z3{background:var(--violet-soft)}.z3 h2{color:var(--violet)}
.hex{aspect-ratio:96/104;max-width:100%;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--surface);border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;font-size:12.5px;font-weight:600;line-height:1.25;text-align:center;padding:8px}
.hex svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 10px;text-align:center}
.stat b{display:block;font-size:26px;font-variant-numeric:tabular-nums;color:var(--accent)}
.stat span{font-size:13px;color:var(--muted)}
.skill{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-top:1px solid var(--line)}
.skill:first-child{border-top:0}
.skill .row{display:flex;justify-content:space-between;font-size:15px;font-weight:600}
.empty{padding:20px;text-align:center;color:var(--muted);font-size:15px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));height:72px;align-items:center}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;line-height:1.15;text-align:center;padding:0 2px;color:var(--muted);cursor:pointer;min-height:56px;justify-content:center}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent);font-weight:700}
.tab.center .ring{width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-28px;border:4px solid var(--bg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:15px;z-index:9}
.profile-card{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--amber-soft);color:var(--amber);display:grid;place-items:center;font-size:22px;font-weight:700}
/* ---- হোম: রেফারেন্স লেআউট ---- */
:root{
  --hero:#1F6FE5; --hero-2:#3F8BF0; --hero-ink:#FFFFFF;
  --panel:#FBFDFF; --panel-head:#EAF2FC; --panel-line:#D9E6F5; --rule:#B9CFEC;
  --green-bg:#E6F7EC; --green-b:#BFE8CD; --green-a:#22A35A;
  --yellow-bg:#FDF6DC; --yellow-b:#F5E2A1; --yellow-a:#F59E0B;
  --pink-bg:#FDECEF; --pink-b:#F7CAD3; --pink-a:#E5484D;
  --purple-bg:#F1ECFB; --purple-b:#D9CCF5; --purple-a:#8B5CF6;
  --sky-bg:#E6F0FC; --sky-b:#C3D9F6; --sky-a:#2F7DE1;
  --mint-bg:#DFF5F3; --mint-b:#B3E6E0; --mint-a:#0EA5A0;
  --orange-bg:#FDF0E1; --orange-b:#F6D3A8; --orange-a:#F97316;
  --rose-bg:#FCE8F3; --rose-b:#F5C2DD; --rose-a:#DB2777;
  --amber-bg:#FEF4D6; --amber-b:#F6DC92; --amber-a:#C77C02;
  --tab-on:#16A34A;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --hero:#1A4F9E; --hero-2:#2560B8; --panel:#131F31; --panel-head:#1A2A44; --panel-line:#26354D; --rule:#34507A;
  --green-bg:#16301F; --green-b:#24503A; --yellow-bg:#332A12; --yellow-b:#57471C; --pink-bg:#3A1B22; --pink-b:#5E2C37;
  --purple-bg:#2A2148; --purple-b:#463873; --sky-bg:#172A47; --sky-b:#2A4670; --mint-bg:#12312F; --mint-b:#1F524E;
  --orange-bg:#3A2614; --orange-b:#5E3E1F; --rose-bg:#3A1830; --rose-b:#5F2A4E; --amber-bg:#352910; --amber-b:#5C4719; --tab-on:#6FD39A}}
:root[data-theme="dark"]{
  --hero:#1A4F9E; --hero-2:#2560B8; --panel:#131F31; --panel-head:#1A2A44; --panel-line:#26354D; --rule:#34507A;
  --green-bg:#16301F; --green-b:#24503A; --yellow-bg:#332A12; --yellow-b:#57471C; --pink-bg:#3A1B22; --pink-b:#5E2C37;
  --purple-bg:#2A2148; --purple-b:#463873; --sky-bg:#172A47; --sky-b:#2A4670; --mint-bg:#12312F; --mint-b:#1F524E;
  --orange-bg:#3A2614; --orange-b:#5E3E1F; --rose-bg:#3A1830; --rose-b:#5F2A4E; --amber-bg:#352910; --amber-b:#5C4719; --tab-on:#6FD39A}
.t-green{--tbg:var(--green-bg);--tb:var(--green-b);--ta:var(--green-a)}
.t-yellow{--tbg:var(--yellow-bg);--tb:var(--yellow-b);--ta:var(--yellow-a)}
.t-pink{--tbg:var(--pink-bg);--tb:var(--pink-b);--ta:var(--pink-a)}
.t-purple{--tbg:var(--purple-bg);--tb:var(--purple-b);--ta:var(--purple-a)}
.t-sky{--tbg:var(--sky-bg);--tb:var(--sky-b);--ta:var(--sky-a)}
.t-mint{--tbg:var(--mint-bg);--tb:var(--mint-b);--ta:var(--mint-a)}
.t-orange{--tbg:var(--orange-bg);--tb:var(--orange-b);--ta:var(--orange-a)}
.t-rose{--tbg:var(--rose-bg);--tb:var(--rose-b);--ta:var(--rose-a)}
.t-amber{--tbg:var(--amber-bg);--tb:var(--amber-b);--ta:var(--amber-a)}
.screen.home{padding-top:0;gap:16px}
.hero{margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding:18px 16px 20px;background:linear-gradient(180deg,var(--hero-2),var(--hero));color:var(--hero-ink);border-radius:0 0 26px 26px;
  display:flex;align-items:center;gap:10px}
.hero .logo-art{width:62px;height:62px;flex-shrink:0}
.hero .ttl{flex:1;min-width:0;text-align:center}
.hero h1{font-family:var(--font-display);font-weight:400;font-size:clamp(24px,7vw,32px);line-height:1.15}
.hero p{margin:4px 0 0;font-size:14px;opacity:.95}
.hero .iconbtn{color:var(--hero-ink)}
.hero .iconbtn:hover{background:rgba(255,255,255,.15)}
.panel{background:var(--panel);border:1px solid var(--panel-line);border-radius:22px;overflow:hidden}
.panel-head{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--panel-head)}
.panel-head .art{width:40px;height:40px;flex-shrink:0}
.panel-head h2{font-family:var(--font-display);font-weight:400;font-size:24px;line-height:1.2}
.panel-head .rule{flex:1;height:1.5px;background:var(--rule)}
.panel-head .chev{color:var(--fg);display:grid}
.tiles{padding:12px;display:grid;gap:10px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.ctile{position:relative;border-radius:16px;border:1.5px solid var(--tb);background:var(--tbg);color:var(--fg);cursor:pointer;display:flex;padding:12px;text-align:left;transition:transform .15s}
.ctile:hover{transform:translateY(-2px)}
.ctile:active{transform:scale(.97)}
/* সব ট্যাবে এনিমেশন: প্রথমবার ঢোকার সময় ধাপে ধাপে আসা, ছবি দুলে ওঠা, ঝিলিক ও ভাসমান প্রতীক */
.home.enter .ctile{animation:tilein .55s cubic-bezier(.2,.8,.3,1.2) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes tilein{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:none}}
.ctile>.art,.ctile .combo-arts .art{animation:artbob 3.4s ease-in-out infinite;animation-delay:calc(var(--i,0)*-.45s)}
@keyframes artbob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(-3deg)}}
.ct-fx{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none;z-index:0}
.ct-fx::after{content:'';position:absolute;top:0;bottom:0;left:-60%;width:45%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);animation:tshine 6s ease-in-out infinite;animation-delay:calc(var(--i,0)*.7s)}
@keyframes tshine{0%,70%{left:-60%}100%{left:130%}}
.ct-fx i{position:absolute;bottom:-14px;left:var(--x);font-style:normal;font-weight:700;font-size:12px;color:var(--ta);opacity:0;white-space:nowrap;animation:tsym 7s linear infinite;animation-delay:calc(var(--j)*-2.3s - var(--i,0)*.5s)}
@keyframes tsym{0%{transform:translateY(0) rotate(0);opacity:0}15%{opacity:.35}80%{opacity:.25}100%{transform:translateY(-150px) rotate(25deg);opacity:0}}
.ctile>*:not(.ct-fx):not(.live-badge):not(.arrow){position:relative;z-index:1}
.ctile .arrow{z-index:1}
.ctile.combo{flex-direction:column;gap:10px;padding:14px 14px 14px;min-height:150px;background:linear-gradient(125deg,var(--purple-bg),var(--green-bg));border-color:var(--purple-b)}
.combo-top{display:flex;align-items:center;gap:12px;padding-right:30px}
.combo-arts{display:flex;flex-shrink:0}
.combo-arts .art{width:54px;height:54px}
.combo-arts .art+.art{margin-left:-12px}
.ctile.combo b{font-size:17px}
.ctile.combo .subj{font-size:15px}
.ctile.combo .price-tag{margin:5px 0 0}
.fx-strip{display:block;overflow:hidden;border-radius:10px;background:rgba(255,255,255,.55);border:1px solid var(--purple-b);padding:6px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.fx-track{display:inline-flex;gap:8px;white-space:nowrap;animation:fxmarq 38s linear infinite;padding-left:8px}
.fx-track i{font-style:normal;font-weight:700;font-size:13px;padding:3px 10px;border-radius:999px;background:var(--surface)}

.rt-row.today{border:2px solid var(--accent)}
.rt-row.fri{background:var(--orange-bg);border-color:var(--orange-b)}
.rt-date{width:58px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;border-radius:10px;background:var(--accent-soft);color:var(--accent);padding:6px 2px;line-height:1.15}
.rt-row.fri .rt-date{background:var(--surface);color:var(--orange-a)}
.rt-date b{font-size:22px}.rt-date span{font-size:13px;font-weight:700}.rt-date small{font-size:11.5px;opacity:.85}
.rt-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.rt-k{font-weight:700;font-size:15.5px}.rt-c{font-size:13px;color:var(--muted)}
.rt-today{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 8px;font-size:12px;margin-left:4px}
.rt-syl{font-size:14px;line-height:1.7}.rt-sl{color:var(--muted);font-weight:600}
.rt-note{font-size:13px;color:var(--muted);margin-top:2px}
.ex-grid.lessons{grid-template-columns:repeat(2,minmax(0,1fr))}
.ex-tile.lesson b{display:flex;flex-direction:column;gap:2px;font-size:15px}.ex-tile.lesson b small{font-size:12.5px;font-weight:600;line-height:1.35;color:var(--muted)}
.pkgbar{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;background:var(--surface);border:2px solid var(--accent);box-shadow:0 6px 14px -8px rgba(16,35,63,.35)}
.pkgbar h2{margin:0;display:flex;align-items:center;gap:6px;font-family:var(--font-display);font-weight:400;font-size:19px;color:var(--accent)}
.pkgbar.none{flex-direction:row;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:8px 16px;font-family:var(--font-display);font-size:19px;color:var(--muted,#5B6B82);border-style:dashed}
.pk-ic{font-size:22px}
.pk-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:12px;background:var(--tbg);border:1.5px solid var(--tb);color:var(--fg);cursor:pointer;font:inherit}
.pk-item b{display:block;font-size:15px}.pk-item small{display:block;font-size:12.5px;color:var(--ta);font-weight:600}
.pk-item.pend small{color:var(--muted,#5B6B82)}
.pk-item .arrow{font-size:22px;color:var(--ta)}
.pick-ic{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex-shrink:0}
.join{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;border:1.5px dashed var(--pink-a);background:var(--pink-bg);color:var(--fg);text-align:left;cursor:pointer}
.join:hover{border-style:solid}
.join .art{width:52px;height:52px;flex-shrink:0}
.join b{display:block;font-family:var(--font-display);font-weight:400;font-size:22px;line-height:1.2;color:var(--pink-a)}
.join small{display:block;font-size:13px;color:var(--muted)}
.join-btn{background:var(--pink-a);color:#fff;font-weight:700;font-size:16px;border-radius:12px;padding:10px 18px;flex-shrink:0}
.join.done{border-style:solid;border-color:var(--green-b);background:var(--green-bg);cursor:default}
.join.done b{color:var(--green-a)}
.joined-badge{display:flex;align-items:center;gap:4px;color:var(--green-a);font-weight:700;font-size:14px;flex-shrink:0}
.tab[aria-current="page"]{color:var(--tab-on)}
@media (max-width:370px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3.hs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

function pkgLinkCard(id){ const k=COURSES[id].pkg||id, p=COURSES[k];

async function sendPay(){
  const f=S.buy, c=COURSES[f.cid];

let payChecking=false;
async function refreshPays(){
  if(payChecking||!DB||!S.pays) return;
  const ids=Object.keys(S.pays).filter(k=>S.pays[k].status==='pending'||(S.pays[k].status==='approved'&&!S.pays[k].synced));
  if(!ids.length) return;
  payChecking=true; let changed=false;
  for(const id of ids){
    try{ const d=await DB.collection('payments').doc(id).get(); if(!d) continue;
      const p=S.pays[id]; if(d.status!==p.status||d.until!==p.until){ Object.assign(p,{status:d.status,until:d.until||0,note:d.note||''}); changed=true; }
      if(d.status==='approved'&&d.until){ const cur=S.enrolled[p.course]; if(!cur||!cur.until||+cur.until<+d.until) S.enrolled[p.course]={at:Date.now(),until:+d.until,pay:id}; p.synced=true; changed=true; }
    }catch(e){}
  }
  payChecking=false;
  if(changed){ persist(); softRender(); }
}

async function decidePay(id,status){
  const p=PAY[id]; if(!p||!DB) return;
  const r=Object.assign({},p); delete r.id;
  r.status=status; r.decidedAt=new Date().toISOString();
  if(status==='approved'){
    const prev=Object.values(PAY).filter(x=>x.id!==id&&x.status==='approved'&&x.course===p.course&&x.device===p.device&&x.until).reduce((m,x)=>Math.max(m,+x.until),0);
    const start=Math.max(Date.now(),prev); r.until=start+payCfg().days*(+p.months||1)*DAYMS;
  } else if(status==='pending'){ delete r.until; delete r.decidedAt; }
  else delete r.until;
  try{ await DB.collection('payments').doc(id).set(r); toast(status==='approved'?'অনুমোদন দেওয়া হয়েছে':status==='rejected'?'বাতিল করা হয়েছে':'আবার বাকি তালিকায়'); }
  catch(e){ toast('পরিবর্তন করা যায়নি'); }
}

/* ---------- পরীক্ষার রুটিন (শেয়ার করা ডেটা) ---------- */
const pad2=n=>String(n).padStart(2,'0');
const isoD=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const parseD=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d);};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const DAYN=['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
const MONN=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
const fmtD=d=>`${d.getDate()} ${MONN[d.getMonth()]}`;
const weekStartOf=d=>addD(d,-((d.getDay()+1)%7)); // শনিবার
const todayISO=()=>isoD(new Date());
const OFFER_IDS=()=>Object.keys(COURSES).filter(k=>COURSES[k].offer);

let SYL={};
let DB=null, CAN_EDIT=false, ROUT=[], RSTATE='loading', pendingRender=false;
function softRender(){
  if(['quiz','login','otp','exam'].includes(S.view)) return;
  const a=document.activeElement;
  if(a&&app.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){ pendingRender=true; return; }
  render();
}
(async()=>{
  const timer=setTimeout(()=>{ if(RSTATE==='loading'){ RSTATE='off'; softRender(); } },10000);
  try{
    if(!(window.claude&&typeof window.claude.use==='function')){ clearTimeout(timer); RSTATE='off'; softRender(); return; }
    const [user,db]=await Promise.all([window.claude.use('user'),window.claude.use('db')]);
    CAN_EDIT = user ? !!(await user.canEdit()) : false;

    db.collection('routines').orderBy('date').onSnapshot(snap=>{
      clearTimeout(timer);
      ROUT=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
      RSTATE='ready'; softRender();
    },()=>{ clearTimeout(timer); RSTATE='error'; softRender(); });
    db.collection('syllabus').onSnapshot(snap=>{
      const m={}; snap.docs.forEach(d=>{ m[d.id]=Object.assign({id:d.id},d.data()); }); SYL=m; SYL_READY=true;
      if(S.sf&&!S.sf.dirty) S.sf.vals=null; if(S.cf&&!S.cf.dirty) S.cf.vals=null; softRender();
    },()=>{});
  }catch(e){ clearTimeout(timer); RSTATE='off'; softRender(); }

/* প্রকাশিত দৈনিক পরীক্ষা + প্রতি সপ্তাহের শুক্রবার নিজে থেকে */
function examsFor(cid){
  const o=COURSES[cid].offer;
  const daily=ROUT.filter(r=>r.course===cid&&typeof r.date==='string'&&canSee(r));
  const byDate={}; daily.forEach(r=>byDate[r.date]=r);
  const weeks=new Set(daily.map(r=>isoD(weekStartOf(parseD(r.date)))));
  const out=daily.map(r=>({pending:!isLive(r),publishAt:r.publishAt,id:r.id,course:cid,date:r.date,kind:'daily',chapter:r.chapter||null,ex:r.ex||null,units:unitsOf(r),files:filesOf(r),syllabus:String(r.syllabus||''),marks:o.daily.marks,mins:o.daily.mins}));
  if(o.friday) weeks.forEach(ws=>{
    const s=parseD(ws), items=[], chs=[], files=[];
    for(let i=0;i<6;i++){ const d=addD(s,i), r=byDate[isoD(d)]; if(r&&r.syllabus) items.push({day:DAYN[d.getDay()],text:String(r.syllabus)}); if(r&&canSee(r)){ unitsOf(r).forEach(v=>{ if(!chs.some(u=>u.ch===v.ch&&u.ex===v.ex)) chs.push(v); }); filesOf(r).forEach(f=>{ if(!files.some(x=>x.u===f.u)) files.push(f); }); } }
    out.push({course:cid,date:isoD(addD(s,6)),kind:'friday',items,chapters:chs,files,marks:o.friday.marks,mins:o.friday.mins});
  });
  out.push(...specialExams(cid));
  return out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
}
/* রুটিনের দিনে এক বা একাধিক অংশ (পুরোনো রুটিনে শুধু chapter/ex থাকে) */
function unitsOf(r){
  if(r&&Array.isArray(r.units)&&r.units.length) return r.units.filter(u=>u&&+u.ch).map(u=>({ch:+u.ch,ex:u.ex?String(u.ex):null}));
  if(r&&r.chapter) return [{ch:+r.chapter,ex:r.ex?String(r.ex):null}];
  return r&&r.course&&r.syllabus?parseUnits(r.course,r.syllabus):[];   // অংশ বেছে না দিলে সিলেবাসের লেখা থেকে চিনে নেওয়া
}
/* সিলেবাসের লেখা থেকে অধ্যায়/অনুশীলনী চেনা: "অনুশীলনী ৮.২, ৮.৩", "অনুশীলনী২, ৮.৩", "অধ্যায় ৫" */
function parseUnits(cid,text){
  const c=COURSES[cid]; if(!c) return [];
  let t=en(String(text||'')); const out=[];
  const add=u=>{ if(!out.some(x=>x.ch===u.ch&&x.ex===u.ex)) out.push(u); };
  const valid=ex=>exList(cid,exCh(ex)).includes(ex);
  const DOT=/(\d{1,2})\s*[.।]\s*(\d{1,2})/g;
  [...t.matchAll(DOT)].forEach(m=>{ const ex=`${+m[1]}.${+m[2]}`; if(valid(ex)) add({ch:+m[1],ex}); });
  t=t.replace(DOT,' ');
  t=t.replace(/অধ্যায়\s*[:\-]?\s*(\d{1,2})/g,(_,n)=>{ n=+n; if(n>=1&&n<=c.chapters.length) add({ch:n,ex:null}); return ' '; });
  const chs=[...new Set(out.filter(u=>u.ex).map(u=>u.ch))];
  if(chs.length===1) [...t.matchAll(/(\d{1,2})/g)].forEach(m=>{ const ex=`${chs[0]}.${+m[1]}`; if(valid(ex)) add({ch:chs[0],ex}); });
  return out.sort((a,b)=>a.ch-b.ch||String(a.ex||'').localeCompare(String(b.ex||''),undefined,{numeric:true}));
}
const unitVal=u=>u.ex?String(u.ex):String(u.ch);
const valUnit=v=>({ch:exCh(v),ex:String(v).indexOf('.')>0?String(v):null});

function studyPdfs(cid,units){
  const idx=STUDY_PDFS[cid]||{}, out=[], seen=new Set();
  const add=(k,t)=>{ const r=idx[k]; if(r&&!seen.has(k)){ seen.add(k); out.push({t,u:'study:'+r.f,s:r.kb*1024,n:r.n,cid,key:k}); } };
  (units||[]).forEach(u=>{
    if(u.ex) add(u.ex,`${exLabel(cid,u.ex,true)} · ${bn(idx[u.ex]?idx[u.ex].n:40)}টি MCQ`);
    else{ const xs=exList(cid,u.ch); if(xs.length) xs.forEach(x=>add(x,`${exLabel(cid,x,true)} · ${bn(idx[x]?idx[x].n:40)}টি MCQ`)); else add('ch'+u.ch,`অধ্যায় ${bn(u.ch)}: ${chTitle(cid,u.ch-1)} · ${bn(idx['ch'+u.ch]?idx['ch'+u.ch].n:40)}টি MCQ`); }
  });
  return out;
}
const isNative=()=>{ const c=window.Capacitor; return !!(c&&c.isNativePlatform&&c.isNativePlatform()); };
const studyUrl=f=>(isNative()?'':FILE_BASE)+'pdf/study/'+f;
async function studyParts(f){
  const r=await fetch(studyUrl(f)); if(!r.ok) throw new Error('fetch');
  const bytes=new Uint8Array(await r.arrayBuffer()), parts=[];
  for(let i=0;i<bytes.length;i+=600*1024) parts.push(b64(bytes.subarray(i,i+600*1024)));
  return parts;
}
async function studyOpen(f,name,save){
  if(!isNative()){
    if(save){ const a=document.createElement('a'); a.href=studyUrl(f); a.download=f; a.target='_blank'; a.rel='noopener'; document.body.appendChild(a); a.click(); a.remove(); }
    else window.open(studyUrl(f),'_blank','noopener');
    return;
  }
  if(S.pdfBusy) return; S.pdfBusy='study:'+f; render();
  try{
    const parts=await studyParts(f), cap=window.Capacitor;
    if(save){ const r=await cap.nativePromise('SohogFile','savePdf',{name:f,parts}); toast(`ডাউনলোড হয়েছে: ${(r&&r.where)||'Download ফোল্ডার'}`); }
    else await cap.nativePromise('SohogFile','openPdf',{name:f,parts,title:String(name||'PDF')});
  }catch(e){ toast(String((e&&e.message)||'').indexOf('noviewer')>=0?'ফোনে PDF খোলার কোনো অ্যাপ নেই':save?'ডাউনলোড করা যায়নি':'PDF খোলা যায়নি'); }

}

function pdfList(files){

function b64(bytes){ let s=''; for(let i=0;i<bytes.length;i+=0x8000) s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000)); return btoa(s); }

async function uploadPdf(key,file){

/* ---------- পরীক্ষার ফলাফল অ্যাডমিনের কাছে (Firebase: results সংগ্রহ) ---------- */
let RES={}, resUnsub=null, RES_OK=null;
function leaderRows(k){ return Object.values(RES).filter(r=>r.examKey===k); }
function rankRows(rows){
  const on=rows.filter(r=>!r.late).sort((a,b)=>b.score-a.score||String(a.at).localeCompare(String(b.at)));
  let rank=0, prev=null; on.forEach((r,i)=>{ if(r.score!==prev){ rank=i+1; prev=r.score; } r._rank=rank; });
  const late=rows.filter(r=>r.late).sort((a,b)=>b.score-a.score);
  return {on,late};
}
function vLeader(){
  const k=S.leaderKey, {course:cid,date}=keyParts(k);

  const e=findExam(k)||{course:cid,date,kind:parseD(date).getDay()===5?'friday':'daily'};
  const {on,late}=rankRows(leaderRows(k)), me=[...on,...late].find(r=>r.device===S.dev);
  const row=(r,rk)=>`<div class="lb-row ${r.device===S.dev?'me':''}"><span class="lb-rank ${rk&&rk<=3?'top'+rk:''}">${rk||'-'}</span>
    <span class="lb-name">${esc(r.name)}${r.device===S.dev?' (তুমি)':''}${r.roll?`<small>রোল ${esc(r.roll)}</small>`:''}</span><b class="lb-score">${r.score}/${r.total}</b></div>`;
  return `<div class="screen">
    <div class="topbar"><button class="iconbtn" data-go="${S.leaderFrom||'routine'}" aria-label="ফিরে যাও">${svg('back','width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"')}</button><h1>মেধাতালিকা</h1><span style="width:44px"></span></div>
    <div class="lb-head"><b>${esc(kindName(e))} · ${fmtD(parseD(date))}</b><span>${COURSES[cid]?COURSES[cid].name+' '+(COURSES[cid].subj||''):''}</span>
      ${me?`<span class="lb-me">${me.late?`তুমি দেরিতে দিয়েছ: ${me.score}/${me.total}`:`তোমার অবস্থান: ${me._rank} / ${on.length}`}</span>`:''}</div>
    ${RES_OK===false?`<div class="empty">মেধাতালিকা এখন দেখা যাচ্ছে না। একটু পরে আবার চেষ্টা করো।</div>`
      :!on.length&&!late.length?`<div class="empty">এখনো কেউ পরীক্ষা দেয়নি।</div>`
      :`${on.length?`<div class="lb">${on.map(r=>row(r,r._rank)).join('')}</div>`:''}
        ${late.length?`<h2 style="margin:4px 0 0;font-size:16px">দেরিতে দেওয়া (মেধাক্রমে নেই)</h2><div class="lb">${late.map(r=>row(r,0)).join('')}</div>`:''}`}
    <p class="muted" style="margin:0;font-size:13px">সমান নম্বর হলে আগে জমা দেওয়া শিক্ষার্থী উপরে থাকে। তালিকা নিজে থেকে হালনাগাদ হয়।</p>
  </div>`;
}
function watchResults(on){
  if(on&&DB&&!resUnsub){
    resUnsub=DB.collection('results').onSnapshot(snap=>{ const m={}; snap.docs.forEach(d=>{ m[d.id]=Object.assign({id:d.id},d.data()); }); RES=m; RES_OK=true; softRender(); },()=>{ RES={}; RES_OK=false; resUnsub=null; softRender(); });
  }
  if(!on&&resUnsub){ try{ resUnsub(); }catch(e){} resUnsub=null; RES={}; }
}
function sendResult(k){
  const r=S.exams[k]; if(!r||r.sent||!DB||!S.student) return;
  const {course,date}=keyParts(k);
  DB.collection('results').doc(`${k}_${S.dev}`).set({course,date,kind:r.kind||(parseD(date).getDay()===5?'friday':'daily'),examKey:k,
    name:S.student.name,roll:S.student.roll||'',score:r.score,total:r.total,late:!!r.late,at:new Date(r.at).toISOString(),device:S.dev})
    .then(()=>{ r.sent=true; r.sendErr=false; persist(); softRender(); },e=>{ if(e&&e.code==='permission_denied'){ r.sendErr=true; persist(); softRender(); } });
}
function sendPendingResults(){ Object.keys(S.exams||{}).forEach(sendResult); }

/* ---------- শিক্ষার্থীর অ্যাকাউন্ট ----------
   • প্রথমবার: মোবাইল নম্বর বা ইমেইল + পাসওয়ার্ড দিয়ে রেজিস্ট্রেশন (Firebase Authentication)।
     শুধু ফোন হলে লগইনের ইমেইল হয় <ফোন>@phone.sohog.app; ঐচ্ছিক রিকভারি ইমেইল দিলে সেটিই লগইনের ইমেইল।
     ফোন → ইমেইল খোঁজার জন্য phones/{ফোন} = {uid, e}।
   • লগইন থাকে যতক্ষণ না নিজে লগ আউট করে।
   • এক অ্যাকাউন্ট একসাথে এক ফোনে: users/{uid}.device-এ শেষ লগইন করা ফোনের id; অন্য ফোনে লগইন হলে
     আগের ফোন এই পরিবর্তন দেখে নিজে থেকেই লগ আউট হয়ে যায়।
   • নাম, ফলাফল, প্রিয়, প্যাকেজ ইত্যাদি users/{uid}.blob-এ থাকে, তাই আবার লগইন করলে সব ফিরে আসে। */
const PHONE_DOMAIN='phone.sohog.app';
let AUTHBUSY=false, ACCT_UNSUB=null, CLOUD_T=null, AUTH_KNOWN=false;
const normPhone=v=>{ const d=en(String(v||'')).replace(/[\s-]/g,'').replace(/^\+?88/,''); return /^01[3-9]\d{8}$/.test(d)?d:''; };
const isEmail=v=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(v||'').trim());
const ACCT_KEYS=['exams','retakes','fav','favx','results','done','enrolled','pays'];
function acctBlob(){ const o={}; ACCT_KEYS.forEach(k=>o[k]=S[k]||{}); o.joined=!!S.joined; o.reports=(S.reports||[]).slice(-50); return JSON.stringify(o); }
function applyBlob(str,merge){
  let d={}; try{ d=JSON.parse(str||'{}')||{}; }catch(e){ d={}; }
  ACCT_KEYS.forEach(k=>{ const c=d[k]&&typeof d[k]==='object'?d[k]:{}; S[k]=merge?Object.assign({},c,S[k]||{}):c; });
  S.joined=!!d.joined||(merge&&!!S.joined);
  const r=Array.isArray(d.reports)?d.reports:[]; const rk=x=>x?String(x.at||'')+'|'+String(x.text||'').slice(0,40):''; S.reports=merge?r.concat((S.reports||[]).filter(x=>!r.some(y=>rk(y)===rk(x)))):r;
}
const clearPersonal=()=>Object.assign(S,{student:null,exams:{},retakes:{},fav:{},favx:{},enrolled:{},pays:{},results:{},done:{},examRun:null,reports:[],joined:false});
function cloudSoon(){ if(!S.uid||!DB||!DB.docSet||AUTHBUSY) return; clearTimeout(CLOUD_T); CLOUD_T=setTimeout(cloudSave,1500); }
function cloudSave(){ if(!S.uid||!DB||AUTHBUSY) return;
  const st=S.student||{};
  DB.docSet('users',S.uid,{name:String(st.name||(S.acct&&S.acct.name)||'').slice(0,60),roll:String(st.roll||'').slice(0,20),blob:acctBlob(),savedAt:new Date().toISOString()},true).catch(()=>{}); }
function watchAcct(uid){
  if(ACCT_UNSUB){ try{ ACCT_UNSUB(); }catch(e){} ACCT_UNSUB=null; }
  if(!uid||!DB||!DB.docWatch) return;
  ACCT_UNSUB=DB.docWatch('users',uid,d=>{
    if(!d||AUTHBUSY||S.uid!==uid) return;
    if(d.device&&d.device!==S.dev){ S.otherDevice=true; acctLogout(true); }
  },()=>{});
}
/* Firebase-এ শিক্ষার্থী লগইন অবস্থায় (অ্যাপ খোলার সময় বা লগইন/রেজিস্ট্রেশনের পরে) */
function acctSignedIn(u){
  AUTH_KNOWN=true;
  if(AUTHBUSY) return;              // লগইন/রেজিস্ট্রেশন চলছে: সেখান থেকেই বাকি কাজ হবে
  if(S.uid!==u.uid){                // এই ফোনে আগে অন্য অবস্থায় ছিল: সার্ভার থেকে তথ্য এনে বসাও
    S.uid=u.uid; S.lastUid=u.uid;
    DB.docGet('users',u.uid).then(d=>{ if(d){ applyBlob(d.blob,false); if(d.name) S.student={name:d.name,roll:d.roll||''}; S.acct=Object.assign({name:d.name||'',phone:d.phone||'',email:u.email,real:!String(u.email).endsWith('@'+PHONE_DOMAIN)},S.acct||{}); }
      if(d&&d.device&&d.device!==S.dev){ S.otherDevice=true; return acctLogout(true); }
      persist(); softRender(); },()=>{});
  }
  watchAcct(u.uid); softRender();
}
/* ===== নোটিশ বোর্ড: অ্যাডমিন লেখেন (syllabus সংগ্রহে type:'notice'), সবাই দেখে ===== */
var SYL_READY=false;
const noticeList=()=>Object.values(SYL).filter(r=>r.type==='notice'&&(CAN_EDIT||isLive(r))).sort((a,b)=>(!!b.pin-!!a.pin)||String(b.at).localeCompare(String(a.at)));
const noticeMax=l=>l.reduce((m,n)=>String(n.at)>m?String(n.at):m,'');
const noticeUnread=()=>CAN_EDIT?0:noticeList().filter(n=>String(n.at)>String(S.noticeSeen||'')).length;
const nfInit=()=>S.nf||(S.nf={id:'',title:'',body:'',course:'all',pin:false,busy:false,err:''});
const linkify=t=>esc(t).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\n/g,'<br>');
function vNotice(){

      <div class="field"><label for="nfTitle">শিরোনাম</label><input class="input" id="nfTitle" data-nf="title" maxlength="120" placeholder="যেমন: শুক্রবারের পরীক্ষা সকাল ১০টায়" value="${esc(nf.title)}"></div>
      <div class="field"><label for="nfBody">বিস্তারিত</label><textarea class="input area" id="nfBody" data-nf="body" maxlength="2000" rows="4" style="min-height:110px" placeholder="নোটিশের পুরো লেখা…">${esc(nf.body)}</textarea></div>
      <div class="nb-row"><div class="field" style="flex:1"><label for="nfCourse">কাদের জন্য</label><select class="input" id="nfCourse" data-nf="course"><option value="all">সব শ্রেণি</option>${ids.map(k=>`<option value="${k}" ${nf.course===k?'selected':''}>${esc(COURSES[k].name)} · ${esc(COURSES[k].subj||'')}</option>`).join('')}</select></div>
        <label class="nb-pin"><input type="checkbox" data-nf="pin" ${nf.pin?'checked':''}> 📌 উপরে পিন করো</label></div>
      ${nf.err?`<div class="error" role="alert">${esc(nf.err)}</div>`:''}
      <div class="nb-row"><button class="btn" data-nfsave ${nf.busy?'disabled':''}>${nf.busy?'প্রকাশ হচ্ছে…':nf.id?'হালনাগাদ করো':'প্রকাশ করো'}</button>${nf.id?`<button class="btn ghost" data-nfcancel>বাতিল</button>`:''}</div>
      <p class="muted" style="margin:0;font-size:13px">প্রকাশ করলেই সব শিক্ষার্থী নোটিশ পাতায় দেখবে, আর অ্যাপে নোটিফিকেশন পাবে।</p>
    </section>`:'';
  return `<div class="screen">
    <div class="topbar"><span style="width:44px"></span><h1>নোটিশ বোর্ড</h1><span style="width:44px"></span></div>
    ${form}
    ${list.length?`<div class="nb-list">${list.map((n,i)=>{ const isNew=!CAN_EDIT&&String(n.at)>seen, c=COURSES[n.course];
      return `<article class="nb ${n.pin?'pin':''} ${isNew?'new':''}" style="--i:${i}">
        <div class="nb-top">${n.pin?'<span class="nb-tag pin">📌 পিন করা</span>':''}${isNew?'<span class="nb-tag new">নতুন</span>':''}<span class="nb-tag">${c?esc(c.name+' · '+(c.subj||'')):'সব শ্রেণি'}</span>${!isLive(n)?'<span class="nb-tag">প্রকাশের অপেক্ষায়</span>':''}</div>
        <h3>${esc(n.title||'নোটিশ')}</h3>
        ${n.body?`<p>${linkify(n.body)}</p>`:''}
        <div class="nb-foot"><span>🕒 ${fmtDT(n.at)}</span>${CAN_EDIT?`<span class="nb-act"><button class="link" data-nfedit="${esc(n.id)}">সম্পাদনা</button><button class="link danger" data-nfdel="${esc(n.id)}">${S.nfArmed===n.id?'নিশ্চিত? আবার চাপো':'মুছুন'}</button></span>`:''}</div>
      </article>`; }).join('')}</div>`
    :`<div class="empty">📭 এখনো কোনো নোটিশ নেই।${CAN_EDIT?' উপরের ফর্মে লিখে প্রথম নোটিশ দিন।':' নতুন নোটিশ এলে এখানে দেখা যাবে।'}</div>`}
  </div>`;
}
async function saveNotice(){
  const nf=nfInit(), title=String(nf.title||'').trim(), body=String(nf.body||'').trim();
  if(!title){ nf.err='শিরোনাম লিখুন।'; return render(); }
  nf.busy=true; nf.err=''; render();
  const id=nf.id||('notice_'+Date.now().toString(36)), old=SYL[id], now=new Date().toISOString();
  try{ await DB.collection('syllabus').doc(id).set({type:'notice',title:title.slice(0,120),body:body.slice(0,2000),course:nf.course||'all',pin:!!nf.pin,at:old&&old.at||now,updatedAt:now});
    S.nf=null; toast(old?'নোটিশ হালনাগাদ হয়েছে':'নোটিশ প্রকাশ হয়েছে'); }
  catch(e){ nf.busy=false; nf.err='প্রকাশ করা যায়নি। ইন্টারনেট দেখে আবার চেষ্টা করুন।'; }
  render();
}
/* ===== লোকাল নোটিফিকেশন (সার্ভার ছাড়া; শুধু অ্যান্ড্রয়েড অ্যাপে) ===== */
var NTF=window.SohogNotify||null, NTF_KEY='sohog-ntf';
var NTF_ST=(()=>{ try{ return JSON.parse(localStorage.getItem(NTF_KEY))||{}; }catch(e){ return {}; } })(), NTF_T=null, NTF_TAP=false;
const ntfSave=()=>{ try{ localStorage.setItem(NTF_KEY,JSON.stringify(NTF_ST)); }catch(e){} };
const ntfId=s=>{ let h=7; for(const ch of String(s)) h=(h*31+ch.charCodeAt(0))|0; return Math.abs(h)%2000000000+1; };
const ntfOn=()=>!!(NTF&&NTF.native)&&!S.ntfOff;
/* কোন কোর্সের পরীক্ষার খবর দেওয়া হবে: চালু প্যাকেজ, ফ্রি ব্যাচ, আগে পরীক্ষা দেওয়া বা এখন বেছে রাখা কোর্স */
function ntfCourses(){
  const took=Object.keys(S.exams||{}).map(k=>k.split('_')[0]);
  return OFFER_IDS().filter(k=>pkgActive(k)||isFreeC(k)||FREE_BATCH[k]||took.includes(k)||S.hubCourse===k);
}
function ntfSyl(e){
  if(e.kind==='friday') return bn((e.items||[]).map(i=>i.text).join(', '))||'সাপ্তাহিক রিভিশন';
  const u=examChapters(e); if(u.length) return bn(u.map(x=>x.ex?exLabel(e.course,x.ex,!!COURSES[e.course].lessons):`অধ্যায় ${x.ch}`).join(', '));
  return e.syllabus||'';
}
function ntfHead(e){ const c=COURSES[e.course]; return `${c.name.replace(' শ্রেণি','')} শ্রেণি · ${c.subj||''}`; }
function scheduleExamNotifs(){ if(!NTF||!NTF.native) return; clearTimeout(NTF_T); NTF_T=setTimeout(scheduleExamNotifsNow,800); }
async function scheduleExamNotifsNow(){
  if(!NTF||!NTF.native||RSTATE!=='ready') return;
  if(!NTF_TAP){ NTF_TAP=true; NTF.onTap(x=>{ if(x&&x.go==='notice') return go('notice'); if(x&&x.go==='admin'&&CAN_EDIT){ S.atab=x.tab||'pay'; return go('admin'); } if(x&&x.course&&COURSES[x.course]){ S.hubCourse=x.course; S.hubFrom='home'; go('exams'); } }); }
  if(SYL_READY){ const nl=noticeList(), mx=noticeMax(nl);
    if(NTF_ST.noticeAt===undefined) NTF_ST.noticeAt=mx;
    else if(mx>NTF_ST.noticeAt){ const mine=ntfCourses(), fr=nl.filter(n=>String(n.at)>NTF_ST.noticeAt&&(n.course==='all'||mine.includes(n.course)));
      if(fr.length&&ntfOn()&&!CAN_EDIT&&S.uid) NTF.schedule([{id:ntfId('notice#'+fr[0].id),title:`📢 ${fr.length>1?bn(fr.length)+'টি নতুন নোটিশ: ':''}${fr[0].title||'নতুন নোটিশ'}`,body:String(fr[0].body||'').slice(0,300),extra:{go:'notice'}}]);
      NTF_ST.noticeAt=mx; }
    ntfSave(); }
  const old=NTF_ST.ids||[];
  if(!ntfOn()||CAN_EDIT||!S.uid){ if(old.length){ await NTF.cancel(old); NTF_ST.ids=[]; ntfSave(); } return; }
  const now=Date.now(), today=todayISO(), lim=isoD(addD(parseD(today),8)), list=[], fresh=[], seen=NTF_ST.seen||null, nowSeen=[];
  ntfCourses().forEach(cid=>examsFor(cid).concat(FREE_BATCH[cid]?specialExams(cid,true):[]).forEach(e=>{
    if(e.pending||e.date<today||e.date>lim||!examPool(e).length) return;
    const k=examKey(e); nowSeen.push(k); if(S.exams[k]) return;
    const nm=kindName(e);
    const body=`${ntfHead(e)}\nসিলেবাস: ${ntfSyl(e)}`, ex={course:cid,key:k};
    const eve=parseD(e.date); eve.setDate(eve.getDate()-1); eve.setHours(19,0,0,0);
    const mor=parseD(e.date); mor.setHours(7,0,0,0);
    const end=parseD(e.date); end.setHours(21,0,0,0);
    if(eve.getTime()>now) list.push({id:ntfId(k+'#eve'),at:eve.getTime(),title:`📅 আগামীকাল ${nm}`,body,extra:ex});
    if(mor.getTime()>now) list.push({id:ntfId(k+'#mor'),at:mor.getTime(),title:`🔴 LIVE: আজ ${nm} চলছে`,body:body+'\nসারাদিন যেকোনো সময় অংশ নিতে পারবে।',extra:ex});
    else if(end.getTime()>now&&e.date===today&&(NTF_ST.today||{})[k]!==today) { list.push({id:ntfId(k+'#now'),title:`🔴 LIVE: ${nm} চলছে`,body:body+'\nএখনই অংশ নাও!',extra:ex}); NTF_ST.today=Object.assign({},NTF_ST.today,{[k]:today}); }
    if(seen&&!seen.includes(k)&&e.date>today) fresh.push(e);
  }));
  if(fresh.length){ const e=fresh[0]; list.push({id:ntfId('new#'+examKey(e)),title:fresh.length>1?`🆕 ${bn(fresh.length)}টি নতুন পরীক্ষা নির্ধারিত হয়েছে`:`🆕 নতুন পরীক্ষা: ${bnD(parseD(e.date)).split(',')[0]}`,body:`${ntfHead(e)}\nসিলেবাস: ${ntfSyl(e)}`,extra:{course:e.course}}); }
  const ids=list.filter(n=>n.at).map(n=>n.id), drop=old.filter(id=>!ids.includes(id));
  if(drop.length) await NTF.cancel(drop);
  const ok=await NTF.schedule(list);
  if(ok||!list.length){ NTF_ST.ids=ids; NTF_ST.seen=nowSeen; ntfSave(); }
}
/* অ্যাডমিন: নতুন পেমেন্ট/রিপোর্ট এলে নোটিফিকেশন (অ্যাপ খোলা বা ব্যাকগ্রাউন্ডে থাকলে; খোলার পর না-দেখাগুলোর খবরও) */
function adminNotify(kind,m){
  if(!CAN_EDIT) return;
  const key=kind==='pay'?'payIds':'repIds', isNew=kind==='pay'?(p=>p.status==='pending'):(r=>r.status!=='done');
  const known=NTF_ST[key], fresh=Object.values(m).filter(x=>isNew(x)&&(!known||!known.includes(x.id)));
  NTF_ST[key]=Object.keys(m); ntfSave();
  if(!known||!fresh.length) return;
  const t=kind==='pay'?`💳 নতুন পেমেন্ট${fresh.length>1?` (${bn(fresh.length)}টি)`:''}`:`🚩 নতুন রিপোর্ট${fresh.length>1?` (${bn(fresh.length)}টি)`:''}`;
  const x=fresh[0], b=kind==='pay'?`${x.name||'শিক্ষার্থী'} · ${bn(x.amount||0)} টাকা · ${x.method||''} TrxID ${x.trx||''}`.trim():`${x.name||'শিক্ষার্থী'}: ${String(x.text||x.type||'').slice(0,80)}`;
  toast(t);
  if(NTF&&NTF.native&&!S.ntfOff) NTF.schedule([{id:ntfId(kind+'#'+x.id),title:t,body:b,channel:'admin',extra:{go:'admin',tab:kind==='pay'?'pay':'reports'}}]);
}
function adminWatchAll(){ if(!CAN_EDIT||!DB) return; watchPays(); watchReports(); if(NTF&&NTF.native) scheduleExamNotifs(); }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) scheduleExamNotifs(); });
function acctSignedOut(){
  AUTH_KNOWN=true;
  if(AUTHBUSY) return;
  if(S.uid){ if(ACCT_UNSUB){ try{ ACCT_UNSUB(); }catch(e){} ACCT_UNSUB=null; } clearTimeout(CLOUD_T); S.uid=null; S.acct=null; clearPersonal(); persist(); }
  softRender();
}
function acctLogout(forced){
  cloudSave();
  if(ACCT_UNSUB){ try{ ACCT_UNSUB(); }catch(e){} ACCT_UNSUB=null; }
  clearTimeout(CLOUD_T); S.uid=null; S.acct=null; clearPersonal(); persist();
  S.au={mode:'login',msg:forced?'এই অ্যাকাউন্টে অন্য একটি ফোন থেকে লগইন করা হয়েছে, তাই এই ফোন থেকে লগ আউট হয়ে গেছে। আবার লগইন করলে অন্য ফোনটি লগ আউট হবে।':''};
  const done=()=>{ go('home'); if(!forced) toast('লগ আউট হয়েছে'); };
  (DB&&DB.signOut?DB.signOut():Promise.resolve()).then(done,done);
}
const authErr=c=>/email-already-in-use/.test(c)?'এই ইমেইলে আগেই অ্যাকাউন্ট খোলা হয়েছে। "লগইন" থেকে ঢুকুন।'
  :/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)?'মোবাইল/ইমেইল বা পাসওয়ার্ড ঠিক নেই।'
  :/weak-password/.test(c)?'পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের দিন।'
  :/invalid-email/.test(c)?'ইমেইলটি সঠিকভাবে লেখা হয়নি।'
  :/too-many-requests/.test(c)?'অনেকবার চেষ্টা হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।'
  :/network|unavailable/.test(c)?'ইন্টারনেট সংযোগ নেই।'
  :/operation-not-allowed/.test(c)?'সার্ভারে Email/Password লগইন চালু নেই।'
  :/permission/.test(c)?'সার্ভারের অনুমতি (Rules) হালনাগাদ করা হয়নি।'
  :'সমস্যা হয়েছে, আবার চেষ্টা করুন।';
/* লগইনের আইডি (ফোন/ইমেইল) থেকে Firebase-এর ইমেইল */
async function loginEmailOf(id){
  if(isEmail(id)) return String(id).trim().toLowerCase();
  const ph=normPhone(id); if(!ph) return '';
  const d=await DB.docGet('phones',ph).catch(e=>{ if(e&&e.code==='unavailable') throw e; return null; });
  return d&&d.e?String(d.e):`${ph}@${PHONE_DOMAIN}`;
}
async function acctRegister(){
  const au=S.au, v=id=>{ const x=document.getElementById(id); return x?x.value:''; };
  const name=v('auName').trim().replace(/\s+/g,' '), roll=v('auRoll').trim(), id=v('auId').trim(), pw=v('auPw'), pw2=v('auPw2'), rec=v('auRec').trim().toLowerCase();
  Object.assign(au,{name,roll,id,rec,err:''});
  const ph=normPhone(id), em=isEmail(id)?id.toLowerCase():'';
  if(name.length<2) au.err='তোমার নাম লেখো।';
  else if(!ph&&!em) au.err='সঠিক মোবাইল নম্বর (০১ দিয়ে শুরু, ১১ অঙ্ক) বা ইমেইল লেখো।';
  else if(pw.length<6) au.err='পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের দাও।';
  else if(pw!==pw2) au.err='দুইবার লেখা পাসওয়ার্ড মেলেনি।';
  else if(ph&&rec&&!isEmail(rec)) au.err='রিকভারি ইমেইলটি সঠিক নয় (না দিতে চাইলে ফাঁকা রাখো)।';
  if(au.err) return render();
  if(!DB||!DB.signUp){ au.err='অ্যাপটি এখনো সার্ভারের সাথে যুক্ত হয়নি। ইন্টারনেট চালু করে আবার চেষ্টা করো।'; return render(); }
  au.busy=true; render(); AUTHBUSY=true;
  try{
    if(ph){ const ex=await DB.docGet('phones',ph).catch(e=>{ if(e&&e.code==='unavailable') throw e; return null; }); if(ex){ throw {code:'phone-taken'}; } }
    const loginEmail=em||(ph&&rec)||`${ph}@${PHONE_DOMAIN}`;
    const u=await DB.signUp(loginEmail,pw,name);
    if(ph) await DB.docSet('phones',ph,{uid:u.uid,e:loginEmail,at:new Date().toISOString()});
    const merge=!S.lastUid||S.lastUid===u.uid;   // এই ফোনের আগের (অ্যাকাউন্ট ছাড়া) অগ্রগতি নতুন অ্যাকাউন্টে যায়
    if(!merge) clearPersonal();
    S.uid=u.uid; S.lastUid=u.uid; S.student={name:name.slice(0,60),roll:roll.slice(0,20)};
    S.acct={name,phone:ph,email:loginEmail,real:!loginEmail.endsWith('@'+PHONE_DOMAIN)};
    const now=new Date().toISOString();
    await DB.docSet('users',u.uid,{name:S.student.name,roll:S.student.roll,phone:ph,email:em||rec||'',device:S.dev,devAt:now,createdAt:now,blob:acctBlob(),savedAt:now});
    AUTHBUSY=false; watchAcct(u.uid); S.au=null; persist(); go('home'); toast('স্বাগতম! অ্যাকাউন্ট খোলা হয়েছে');
  }catch(e){
    AUTHBUSY=false; au.busy=false; const c=(e&&e.code)||'';
    au.err=c==='phone-taken'?'এই মোবাইল নম্বরে আগেই অ্যাকাউন্ট খোলা হয়েছে। "লগইন" থেকে ঢুকুন।':authErr(c);
    if(S.uid==null&&DB&&DB.signOut&&c!=='phone-taken') DB.signOut().catch(()=>{});
    render();
  }
}
async function acctLogin(){
  const au=S.au, id=(document.getElementById('auId')||{}).value||'', pw=(document.getElementById('auPw')||{}).value||'';
  Object.assign(au,{id:id.trim(),err:'',msg:''});
  if(!normPhone(id)&&!isEmail(id)) au.err='সঠিক মোবাইল নম্বর বা ইমেইল লেখো।';
  else if(!pw) au.err='পাসওয়ার্ড লেখো।';
  if(au.err) return render();
  if(!DB||!DB.signIn){ au.err='অ্যাপটি এখনো সার্ভারের সাথে যুক্ত হয়নি। ইন্টারনেট চালু করে আবার চেষ্টা করো।'; return render(); }
  au.busy=true; render(); AUTHBUSY=true;
  try{
    const email=await loginEmailOf(id);
    const u=await DB.signIn(email,pw);
    if(await DB.checkAdmin()===true){ AUTHBUSY=false; S.au=null; CAN_EDIT=true; S.adminEmail=u.email; persist(); go('admin'); toast('অ্যাডমিন হিসেবে লগইন হয়েছে'); return; }
    const d=await DB.docGet('users',u.uid);
    const merge=!S.lastUid||S.lastUid===u.uid;
    if(d) applyBlob(d.blob,merge); else if(!merge) clearPersonal();
    S.uid=u.uid; S.lastUid=u.uid;
    S.student={name:(d&&d.name)||(S.student&&S.student.name)||'',roll:(d&&d.roll)||(S.student&&S.student.roll)||''}; if(!S.student.name) S.student=null;
    S.acct={name:(d&&d.name)||'',phone:(d&&d.phone)||normPhone(id),email:u.email,real:!u.email.endsWith('@'+PHONE_DOMAIN)};
    const now=new Date().toISOString();
    await DB.docSet('users',u.uid,{device:S.dev,devAt:now,blob:acctBlob(),savedAt:now,name:S.student?S.student.name:'',roll:S.student?S.student.roll:''},true);
    AUTHBUSY=false; watchAcct(u.uid); S.au=null; persist(); go('home'); toast('স্বাগতম! লগইন হয়েছে');
  }catch(e){ AUTHBUSY=false; au.busy=false; au.err=authErr((e&&e.code)||''); if(!S.uid&&DB&&DB.signOut&&!CAN_EDIT) DB.signOut().catch(()=>{}); render(); }
}
async function acctForgot(){
  const au=S.au, id=((document.getElementById('auId')||{}).value||'').trim(); Object.assign(au,{id,err:'',msg:''});
  if(!normPhone(id)&&!isEmail(id)){ au.err='যে মোবাইল নম্বর বা ইমেইলে অ্যাকাউন্ট খুলেছিলে সেটি লেখো।'; return render(); }
  au.busy=true; render();
  try{
    const email=await loginEmailOf(id);
    if(email.endsWith('@'+PHONE_DOMAIN)){ au.busy=false; au.err='এই নম্বরের অ্যাকাউন্টে কোনো রিকভারি ইমেইল দেওয়া নেই, তাই রিসেট লিংক পাঠানো যাচ্ছে না। পাসওয়ার্ড বদলাতে "সমস্যা জানাও" বা শিক্ষকের সাথে যোগাযোগ করো।'; return render(); }
    await DB.resetPassword(email);
    au.busy=false; au.msg=`পাসওয়ার্ড বদলানোর লিংক ${email.replace(/^(.{2}).*(@.*)$/,'$1•••$2')} ঠিকানায় পাঠানো হয়েছে। ইমেইল খুলে লিংকে চাপ দিয়ে নতুন পাসওয়ার্ড দাও, তারপর লগইন করো।`; au.mode='login'; render();
  }catch(e){ au.busy=false; au.err=/user-not-found/.test((e&&e.code)||'')?'এই তথ্যে কোনো অ্যাকাউন্ট নেই।':authErr((e&&e.code)||''); render(); }
}

const csvCell=v=>{ v=String(v==null?'':v); return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
function resultsCSV(keys){
  const head=['পরীক্ষা','তারিখ','শ্রেণি','মেধা','নাম','রোল','প্রাপ্ত নম্বর','মোট নম্বর','শতকরা','দেরিতে','জমার সময়'];
  const lines=[head];
  keys.forEach(k=>{
    const m=examMeta(k), rows=Object.values(RES).filter(r=>r.examKey===k).sort((a,b)=>b.score-a.score||String(a.at).localeCompare(String(b.at)));
    let rank=0, prev=null;
    rows.forEach((r,i)=>{ if(r.score!==prev){ rank=i+1; prev=r.score; } const d=new Date(r.at);
      lines.push([m.name,m.date,COURSES[m.course]?COURSES[m.course].name:'',rank,r.name,r.roll||'',r.score,r.total,r.total?Math.round(r.score/r.total*1000)/10:'',r.late?'হ্যাঁ':'না',isNaN(d)?'':`${isoD(d)} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`]); });
  });
  return '\uFEFF'+lines.map(l=>l.map(csvCell).join(',')).join('\r\n');
}
async function downloadCSV(all){
  const keys=all?[...new Set(Object.values(RES).map(r=>r.examKey).filter(Boolean))].sort((a,b)=>examMeta(b).date.localeCompare(examMeta(a).date)):[S.resKey];
  if(!keys.length||!keys[0]) return toast('কোনো ফলাফল নেই');
  const text=resultsCSV(keys), name=all?`sohog-result-all-${todayISO()}.csv`:`sohog-result-${keys[0]}.csv`;
  const cap=window.Capacitor;
  if(cap&&cap.isNativePlatform&&cap.isNativePlatform()){
    try{ await cap.nativePromise('SohogFile','share',{name,mime:'text/csv',content:text,title:'ফলাফল সংরক্ষণ বা শেয়ার'}); }
    catch(e){ toast('এই অ্যাপ সংস্করণে ফাইল তৈরি করা যায়নি। নতুন APK নিন বা পিসি থেকে নামান।'); }
    return;
  }
  try{
    const url=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'})), a=document.createElement('a');
    a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);

async function publishRoutine(){

      const k=isoD(addD(s,i)), id=`${rf.course}_${k}`, units=((rf.chs&&rf.chs[k])||[]).map(valUnit).filter(u=>u.ch);
      let txt=String(rf.vals[k]||'').trim();
      const files=((rf.files&&rf.files[k])||[]).slice(0,10);
      if(!units.length&&String(rf.vals[k]||'').trim()){ parseUnits(rf.course,rf.vals[k]).forEach(u=>units.push(u)); }
      const ch=units.length?units[0].ch:null, ex=units.length?units[0].ex:null;
      const had=ROUT.find(x=>x.id===id), same=had&&JSON.stringify(unitsOf(had))===JSON.stringify(units)&&JSON.stringify(filesOf(had))===JSON.stringify(files);
      if(had&&!same&&txt&&txt===autoSyl(rf.course,unitsOf(had))) txt='';
      if(!txt&&units.length) txt=autoSyl(rf.course,units);
      if(txt){ if(!had||had.syllabus!==txt||!same||rf.when==='later'||!isLive(had)) await DB.collection('routines').doc(id).set({course:rf.course,date:k,kind:'daily',syllabus:txt,chapter:ch,ex,units,files,publishAt:(had&&had.syllabus===txt&&isLive(had)&&rf.when!=='later')?(had.publishAt||w.iso):w.iso,updatedAt:new Date().toISOString()}); }
      else if(had){ await DB.collection('routines').doc(id).delete(); }
    }
    S.publishing=false; rf.vals=null; const later=rf.when==='later'; rf.when='now'; rf.at=''; render(); toast(later?'রুটিন নির্ধারিত সময়ে প্রকাশ হবে':'রুটিন প্রকাশ হয়েছে');

const isLive = r => !r.publishAt || Date.parse(r.publishAt) <= Date.now();

function fmtDT(iso){
  const d=new Date(iso); if(isNaN(d)) return '';
  const h=d.getHours(), m=d.getMinutes();
  const part=h<4?'রাত':h<6?'ভোর':h<12?'সকাল':h<15?'দুপুর':h<18?'বিকাল':h<20?'সন্ধ্যা':'রাত';
  return `${fmtD(d)}, ${part} ${h%12||12}:${pad2(m)}`;
}
const localDT = d => `${isoD(d)}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`;

function whenISO(st){
  if(st.when!=='later') return {iso:new Date().toISOString()};
  const d=st.at?new Date(st.at):null;
  if(!d||isNaN(d)) return {err:'প্রকাশের তারিখ ও সময় বেছে নিন।'};
  if(d.getTime()<=Date.now()) return {err:'প্রকাশের সময় এখনকার পরে হতে হবে। এখনই প্রকাশ করতে "এখনই প্রকাশ" বেছে নিন।'};
  return {iso:d.toISOString()};
}

const QLV=['সহজ','মধ্যম','কঠিন'];
function customQs(cid,no){
  return Object.values(SYL).filter(r=>r.type==='mcq'&&r.course===cid&&+r.ch===+no&&Array.isArray(r.o)&&r.o.length===4)
    .sort((a,b)=>String(a.createdAt||'')<String(b.createdAt||'')?-1:1)
    .map(r=>({n:'x:'+r.id,q:String(r.q),o:r.o.map(String),a:+r.a,e:String(r.e||''),lv:QLV.indexOf(r.lv)>=0?r.lv:'মধ্যম',ex:r.ex?String(r.ex):'',custom:true,id:r.id}));
}
function qfInit(){
  if(!S.qf) S.qf={course:CH_COURSES()[0], ch:1, ex:'', mode:'one', q:'', o:['','','',''], a:-1, e:'', lv:'সহজ', bulk:'', parsed:null, editId:null, armed:'', busy:false, msg:'', showAll:false};
  return S.qf;
}
const LET={'ক':0,'খ':1,'গ':2,'ঘ':3,'a':0,'b':1,'c':2,'d':3};
function parseBulk(text){
  const blocks=String(text||'').replace(/\r/g,'').split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean);
  const out=[], errs=[];
  blocks.forEach((b,bi)=>{
    const lines=b.split('\n').map(l=>l.trim()).filter(Boolean);
    const q={q:[],o:[null,null,null,null],a:-1,e:'',lv:'মধ্যম'};
    lines.forEach(l=>{
      let m;
      if((m=l.match(/^[\(（]?\s*([কখগঘabcdABCD])\s*[\)\.।:）]\s*(.+)$/))&&q.q.length){ q.o[LET[m[1].toLowerCase()]]=m[2].trim(); return; }
      if((m=l.match(/^(উত্তর|উঃ|উ:|ans(wer)?)\s*[:：\-=]?\s*[\(（]?\s*([কখগঘabcdABCD])/i))){ q.a=LET[m[3].toLowerCase()]; return; }
      if((m=l.match(/^(ব্যাখ্যা|সমাধান|explanation)\s*[:：\-]\s*(.*)$/i))){ q.e=m[2].trim(); return; }
      if((m=l.match(/^(স্তর|মান|level)\s*[:：\-]\s*(সহজ|মধ্যম|কঠিন)/i))){ q.lv=m[2]; return; }
      if(q.o.some(Boolean)) { q.e=q.e?q.e+' '+l:l; return; }
      q.q.push(l.replace(/^\d+\s*[\.\)।]\s*/,''));
    });
    const no=bi+1;
    if(!q.q.length) errs.push(`${no} নম্বর প্রশ্ন: প্রশ্নের লেখা নেই`);
    else if(q.o.some(x=>!x)) errs.push(`${no} নম্বর প্রশ্ন: ক, খ, গ, ঘ চারটি অপশনই লাগবে`);
    else if(new Set(q.o).size<4) errs.push(`${no} নম্বর প্রশ্ন: দুটি অপশন একই রকম`);
    else if(q.a<0) errs.push(`${no} নম্বর প্রশ্ন: "উত্তর: গ" এভাবে সঠিক উত্তর লিখুন`);
    else out.push({q:q.q.join(' '),o:q.o,a:q.a,e:q.e,lv:q.lv});
  });
  return {qs:out,errs,blocks:blocks.length};
}

  QUIZZES[`mcq_${cid}_${j+1}_${lv}`]={title:`অধ্যায় ${j+1} · ${MCQ_LV[lv]} MCQ`, skill:'MCQ', qs:(((window.SOHOG_MCQ||{})[cid]||{})[String(j+1)]||[]).slice(0,MCQ_N)};
  (((COURSES[cid].exs)||{})[j+1]||[]).forEach(ex=>{ QUIZZES[`mcq_${cid}_${ex.replace('.','-')}_${lv}`]={title:`অনুশীলনী ${exName(ex)} · ${MCQ_LV[lv]} MCQ`, skill:'MCQ', qs:[]}; });
})));})();
function fillMcq(id){
  const m=id.match(/^mcq_(\w+?)_(\d+)(?:-(\d+))?_(easy|mid|hard|mix)$/); if(!m) return;
  const ex=m[3]?`${m[2]}.${m[3]}`:null, lv=m[4];
  const all=ex?exBank(m[1],ex):bankFor(m[1],m[2]);
  if(!QUIZZES[id]) QUIZZES[id]={title:`${ex?'অনুশীলনী '+ex:'অধ্যায় '+m[2]} · ${MCQ_LV[lv]} MCQ`, skill:'MCQ', qs:[]};
  let pool=lv==='mix'?all.slice():all.filter(x=>x.lv===MCQ_LV[lv]);
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  QUIZZES[id].qs=pool.slice(0,MCQ_N);
}
function mcqSection(cid,i){ return mcqBox(cid,String(i+1),mcqBank(cid,i)); }
/* ---------- অনুশীলনী (যেমন 2.1, 3.4) ---------- */

const exCh=ex=>+String(ex).split('.')[0];
/* অনুশীলনী বা পাঠের নাম (বিজ্ঞানে 'পাঠ') */
function exLabel(cid,ex,full){ const c=COURSES[cid]||{}, l=c.lessons&&c.lessons[ex]; return l?(full?`${l[0]}: ${l[1]}`:l[0]):`অনুশীলনী ${exName(ex)}`; }
const unitWord=cid=>(COURSES[cid]&&COURSES[cid].unitWord)||'অনুশীলনী';
const unitOf=cid=>unitWord(cid)==='পাঠ'?'পাঠের':'অনুশীলনীর';
function exName(ex){ return String(ex).replace(/^(\d+)\.([A-Z])$/,'$1($2)'); }
const exNoteId=(cid,ex)=>`ex_${cid}_${String(ex).replace('.','_')}`;
const exDom=ex=>String(ex).replace('.','-');
function exDoc(cid,ex){ const r=SYL[exNoteId(cid,ex)]; return r&&canSee(r)?r:null; }
function exBank(cid,ex){ return bankFor(cid,exCh(ex)).filter(q=>q.ex===ex); }

  </section>`;
}
function mcqBox(cid,part,b,label){

  const ne=b.filter(x=>x.lv==='সহজ').length, nm=b.filter(x=>x.lv==='মধ্যম').length, nh=b.filter(x=>x.lv==='কঠিন').length;

    return `<button class="mcq-btn" data-quiz="${id}"><b>${MCQ_LV[lv]}</b><span>${desc}</span><span class="mcq-best">${r?`সেরা: ${r.best}/${r.total}`:'এখনো দেওয়া হয়নি'}</span></button>`;};
  return `<section class="mcq-box" aria-label="MCQ অনুশীলন">

    <div class="mcq-grid ${nh?'four':''}">${card('easy',`${ne}টি থেকে`)}${card('mid',`${nm}টি থেকে`)}${nh?card('hard',`${nh}টি থেকে`):''}${card('mix','সব প্রশ্ন')}</div>

async function publishChapter(){
  const cf=cfInit(), el=()=>document.getElementById('cfErr'), w=whenISO(cf);
  const title=cf.vals.title.trim(), note=cf.vals.note.trim(), link=cf.vals.link.trim();
  const files=(cf.vals.files||[]).slice(0,10);
  if(!note&&!link&&!files.length){ el().textContent='নোট বা লিংক — অন্তত একটি দিন।'; return; }
  if(link&&!safeLink(link)){ el().textContent='লিংকটি https:// দিয়ে শুরু হতে হবে।'; return; }
  if(w.err){ el().textContent=w.err; return; }
  S.cpublishing=true; render();
  try{

async function publishSpecial(){

  }catch(e){

  }
  if(t.dataset.atab){ S.atab=t.dataset.atab; render(); return; }
  if(t.hasAttribute('data-xfbriti')){ const xf=xfInit(), c=COURSES[xf.course]; Object.assign(xf,{title:`বৃত্তি মডেল টেস্ট (${c.subj})`, marks:'50', mins:'50', units:c.chapters.map((_,i)=>String(i+1)), syllabus:'পূর্ণ সিলেবাস', aud:'paid'}); render(); toast('বৃত্তি মডেল টেস্ট ফর্মে বসানো হয়েছে; তারিখ দেখে প্রকাশ করুন'); return; }
  if(t.hasAttribute('data-nfsave')){ saveNotice(); return; }
  if(t.hasAttribute('data-nfcancel')){ S.nf=null; render(); return; }
  if(t.dataset.nfedit){ const n=SYL[t.dataset.nfedit]; if(n){ S.nf={id:n.id,title:n.title||'',body:n.body||'',course:n.course||'all',pin:!!n.pin,busy:false,err:''}; render(); window.scrollTo(0,0); } return; }
  if(t.dataset.nfdel){ const id=t.dataset.nfdel; if(S.nfArmed===id){ S.nfArmed=''; DB.collection('syllabus').doc(id).delete().then(()=>toast('নোটিশ মুছে ফেলা হয়েছে'),()=>toast('মুছে ফেলা যায়নি')); } else { S.nfArmed=id; render(); } return; }
  if(t.hasAttribute('data-ntftoggle')){ S.ntfOff=!S.ntfOff; persist(); if(!S.ntfOff&&NTF) NTF.ready(); toast(S.ntfOff?'নোটিফিকেশন বন্ধ করা হয়েছে':'নোটিফিকেশন চালু করা হয়েছে'); render(); return; }
  if(t.hasAttribute('data-spublish')){ if(!S.spublishing) publishSyllabus(); return; }
  if(t.dataset.sdel){
    const sf=sfInit();
    if(sf.armed){ sf.armed=false; DB.collection('syllabus').doc(t.dataset.sdel).delete().then(()=>{ sf.vals=null; toast('সিলেবাস মুছে ফেলা হয়েছে'); },()=>toast('মুছে ফেলা যায়নি')); }
    else{ sf.armed=true; render(); }
    return;
  }
  if(t.hasAttribute('data-publish')){ if(!S.publishing) publishRoutine(); return; }
  if(t.hasAttribute('data-xpublish')){ if(!S.xpublishing) publishSpecial(); return; }
  if(t.dataset.rfrm){ const [k,i]=t.dataset.rfrm.split('|'), rf=rfInit(); if(rf.chs&&rf.chs[k]) rf.chs[k].splice(+i,1); render(); return; }
  if(t.dataset.xfrm){ const i=+t.dataset.xfrm.split('|')[1]; xfInit().units.splice(i,1); render(); return; }
  if(t.dataset.xdel){ const id=t.dataset.xdel, xf=xfInit();
    if(xf.armed===id||t.dataset.armed){ xf.armed=''; DB.collection('syllabus').doc(id).delete().then(()=>toast('পরীক্ষাটি মুছে ফেলা হয়েছে'),()=>toast('মুছে ফেলা যায়নি')); }
    else if(S.view==='admin'){ xf.armed=id; render(); }
    else{ t.dataset.armed='1'; t.textContent='নিশ্চিত? আবার চাপুন'; }
    return; }
  if(t.dataset.wk){ const rf=rfInit(); rf.week=isoD(addD(parseD(rf.week),+t.dataset.wk)); rf.vals=null; render(); return; }
  if(t.hasAttribute('data-past')){ S.showPast=!S.showPast; render(); return; }
  if(t.dataset.del){
    if(t.dataset.armed){ const id=t.dataset.del; DB.collection('routines').doc(id).delete().then(()=>toast('পরীক্ষাটি মুছে ফেলা হয়েছে'),()=>toast('মুছে ফেলা যায়নি')); }
    else{ t.dataset.armed='1'; t.textContent='নিশ্চিত? আবার চাপুন'; }
    return;
  }
  if(t.dataset.buy){ S.buyCid=pkgKey(t.dataset.buy); S.course=S.buyCid; S.buy=null; return go('buy'); }
  if(t.dataset.paym){ S.buy.m=t.dataset.paym; render(); return; }
  if(t.dataset.paymo){ S.buy.months=+t.dataset.paymo; render(); return; }
  if(t.dataset.paycopy!==undefined){ const v=t.dataset.paycopy; (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('কপি হয়েছে: '+v),()=>toast(v)); return; }
  if(t.hasAttribute('data-paysend')){ if(!S.buy.busy) sendPay(); return; }
  if(t.hasAttribute('data-paycheck')){ Object.values(S.pays||{}).forEach(p=>{}); refreshPays().then(()=>toast('অবস্থা হালনাগাদ হয়েছে')); return; }
  if(t.dataset.payf2){ S.payF=t.dataset.payf2; render(); return; }
  if(t.dataset.payok||t.dataset.payno){ const id=t.dataset.payok||t.dataset.payno, tag=id+(t.dataset.payok?'y':'n');
    if(S.payArmed===tag){ S.payArmed=''; decidePay(id,t.dataset.payok?'approved':'rejected'); } else { S.payArmed=tag; render(); } return; }
  if(t.dataset.payundo){ decidePay(t.dataset.payundo,'pending'); return; }
  if(t.hasAttribute('data-pcsave')){ savePayCfg(); return; }
  if(t.hasAttribute('data-primary')){
    if(!S.joined){ S.joined=true; persist(); toast('পঞ্চম শ্রেণিতে ফ্রীতে যুক্ত হয়েছ'); }
    return go('course',{course:'p5'});
  }
  if(t.hasAttribute('data-join')){ S.joined=true; persist(); render(); toast('ফ্রী ক্লাসে জয়েন হয়েছে'); return; }
  if(t.dataset.chub) return go('chub',{chubCid:t.dataset.chub});
  if(t.dataset.course) return go('course',{cview:!!t.dataset.cview,course:t.dataset.course,courseFrom:S.view==='play'?'play':S.view==='chub'?'chub':'home',featOpen:null});
  if(t.dataset.quiz) return startQuiz(t.dataset.quiz);
  if(t.dataset.chapter!==undefined){
    const k=S.course+':'+t.dataset.chapter;
    if(S.done[k]) delete S.done[k]; else S.done[k]=true;
    persist(); render(); toast(S.done[k]?'অধ্যায় সম্পন্ন চিহ্নিত হয়েছে':'চিহ্ন তুলে নেওয়া হয়েছে'); return;
  }
  if(t.dataset.opt!==undefined && S.quiz){
    const Q=S.quiz, item=QUIZZES[Q.id].qs[Q.i];
    Q.pick=+t.dataset.opt; if(Q.pick===item.a) Q.score++; render(); return;
  }
  if(t.hasAttribute('data-next') && S.quiz){
    const Q=S.quiz, set=QUIZZES[Q.id];
    if(Q.i+1<set.qs.length){ Q.i++; Q.pick=null; render(); }
    else{
      Q.finished=true;
      const prev=S.results[Q.id];
      S.results[Q.id]={best:Math.max(prev?prev.best:0,Q.score),last:Q.score,total:set.qs.length,plays:(prev&&prev.plays||0)+1};
      persist(); render();
    }
    return;
  }
  if(t.hasAttribute('data-reset')){
    if(t.dataset.armed){ S.results={}; S.done={}; persist(); render(); toast('অগ্রগতি মুছে ফেলা হয়েছে'); }
    else{ t.dataset.armed='1'; document.getElementById('resetHint').textContent='নিশ্চিত? আবার চাপুন'; }
    return;
  }
  if(t.hasAttribute('data-logout')){ S.user=null; persist(); go('login'); return; }
});
app.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.nf){ nfInit()[t.dataset.nf]=t.type==='checkbox'?t.checked:t.value; }
  if(t.dataset.payf&&S.buy){ S.buy[t.dataset.payf]=t.value; }
  if(t.dataset.pcf&&t.type!=='checkbox'){ pcInit()[t.dataset.pcf]=t.value; }
  if(t.dataset.rfday){ rfInit().vals[t.dataset.rfday]=t.value; }
  if(t.dataset.qf&&['q','e','bulk'].includes(t.dataset.qf)){ const qf=qfInit(); qf[t.dataset.qf]=t.value; if(t.dataset.qf==='bulk') qf.parsed=null; }
  if(t.dataset.qfo!==undefined){ qfInit().o[+t.dataset.qfo]=t.value; }
  if(t.dataset.eq!==undefined&&S.examRun){
    const qi=+t.dataset.eq, fs=t.closest('fieldset');
    if(S.examRun.ans[qi]!==undefined){ fs&&fs.querySelectorAll('input').forEach(x=>{ x.checked=+x.value===S.examRun.ans[qi]; }); return; }
    S.examRun.ans[qi]=+t.value; persist();
    if(fs) fs.querySelectorAll('input').forEach(x=>{ x.disabled=true; x.closest('label').classList.add('locked'); });
    const n=Object.keys(S.examRun.ans).length, b=app.querySelector('[data-exsubmit]'), h=document.getElementById('exHint');
    if(b&&!S.exSubmitArmed) b.textContent=`খাতা জমা দাও (${n}/${S.examRun.total})`; if(h) h.textContent=S.examRun.total-n>0?`${S.examRun.total-n}টি প্রশ্নের উত্তর দেওয়া বাকি`:''; }
  if(t.dataset.cfv){ const cf=cfInit(); cf.vals[t.dataset.cfv]=t.value; cf.dirty=true; }
  if(t.dataset.sfv){ const sf=sfInit(); sf.vals[t.dataset.sfv]=t.value; sf.dirty=true; }
  if(t.dataset.whenat){ const st=stFor(t.dataset.whenat); st.at=t.value; }
  if(t.dataset.xf&&t.dataset.xf!=='course'){ xfInit()[t.dataset.xf]=t.value; }
  if(t.dataset.pdft!==undefined||t.dataset.pdfu!==undefined){ const key=t.dataset.pdft||t.dataset.pdfu; S.pdfDraft=S.pdfDraft||{}; const d=S.pdfDraft[key]=S.pdfDraft[key]||{t:'',u:''}; if(t.dataset.pdft!==undefined) d.t=t.value; else d.u=t.value; }
  if(t.dataset.frd){ const fr=frInit(); fr.rd[t.dataset.frd]=t.value; }
  if(t.dataset.fbf){ const f=fbInit(); f[t.dataset.fbf]=t.value; if(t.dataset.fbf==='text'){ const c=document.getElementById('fbCount'); if(c) c.textContent=bn(t.value.length)+'/১০০০'; } }
  if(t.dataset.xq){ S.xq=t.value; S.xpage=1; const el=document.getElementById('xaList'); if(el&&!routineStateMsg()) el.innerHTML=xaListHTML(); }
});
app.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.pcf==='enforce'){ pcInit().enforce=t.checked; return; }
  if(t.dataset.pdffile){ const f=t.files&&t.files[0]; t.value=''; if(f) uploadPdf(t.dataset.pdffile,f); return; }
  if(t.dataset.rf==='week'&&t.value){ const rf=rfInit(); rf.week=isoD(weekStartOf(parseD(t.value))); rf.vals=null; pendingRender=false; render(); }
  if(t.dataset.when){ const st=stFor(t.dataset.when); st.when=t.value; if(t.value==='later'&&!st.at){ const d=new Date(Date.now()+3600000); d.setMinutes(0); st.at=localDT(d); } pendingRender=false; render(); }
  if(t.dataset.whenat){ const st=stFor(t.dataset.whenat); st.at=t.value; }
  if(t.dataset.res){ S.resKey=t.value; pendingRender=false; render(); }
  if(t.dataset.cf==='ex'){ Object.assign(cfInit(),{ex:t.value,vals:null,dirty:false,armed:false}); pendingRender=false; render(); }
  if(t.dataset.qf==='ex'){ Object.assign(qfInit(),{ex:t.value,editId:null,editRef:null,qp:1,armed:''}); pendingRender=false; render(); }
  if(t.dataset.cf==='course'){ Object.assign(cfInit(),{course:t.value,no:0,vals:null,dirty:false,armed:false}); pendingRender=false; render(); }
  if(t.dataset.qf==='course'){ Object.assign(qfInit(),{course:t.value,ch:1,editRef:null,qp:1,editId:null,armed:'',showAll:false,err:''}); pendingRender=false; render(); }
  if(t.dataset.qf==='ch'){ Object.assign(qfInit(),{ex:'',ch:+t.value,editRef:null,qp:1,editId:null,armed:'',showAll:false,err:''}); pendingRender=false; render(); }
  if(t.dataset.qf==='lv'){ qfInit().lv=t.value; }
  if(t.dataset.qfs){ Object.assign(qfInit(),{qs:t.value,qp:1}); pendingRender=false; render(); }
  if(t.dataset.qflv!=null&&t.matches('[data-qflv]')){ Object.assign(qfInit(),{flv:t.value,qp:1}); pendingRender=false; render(); }
  if(t.dataset.qfdel){ Object.assign(qfInit(),{fdel:t.checked,qp:1}); pendingRender=false; render(); }
  if(t.dataset.qfa!==undefined){ qfInit().a=+t.dataset.qfa; }
  if(t.dataset.qfmode){ qfInit().mode=t.dataset.qfmode; pendingRender=false; render(); }
  if(t.dataset.rfadd!==undefined&&t.value){ const rf=rfInit(), k=t.dataset.rfadd; rf.chs=rf.chs||{}; const a=rf.chs[k]=rf.chs[k]||[]; if(!a.includes(t.value)) a.push(t.value); pendingRender=false; render(); }
  if(t.dataset.xfadd&&t.value){ const xf=xfInit(); if(!xf.units.includes(t.value)) xf.units.push(t.value); pendingRender=false; render(); }
  if(t.dataset.xfaud){ const xf=xfInit(); xf.aud=t.value; if(t.value==='free'&&!xf.title) xf.title='সাপ্তাহিক ফ্রী পরীক্ষা'; pendingRender=false; render(); }
  if(t.dataset.xkind){ S.xfilter=t.value; S.xpage=1; pendingRender=false; render(); }
  if(t.dataset.xstat){ S.xstat=t.value; S.xpage=1; pendingRender=false; render(); }
  if(t.dataset.xgo){ S.xgo=t.value; S.xpage=1; pendingRender=false; render(); }
  if(t.dataset.xpgsel){ S.xpage=+t.value; pendingRender=false; render(); window.scrollTo(0,0); }
  if(t.dataset.xf==='course'){ Object.assign(xfInit(),{course:t.value,units:[],armed:'',err:''}); pendingRender=false; render(); }
  if(t.dataset.xf&&t.dataset.xf!=='course'){ xfInit()[t.dataset.xf]=t.value; }
  if(t.dataset.cf==='no'){ const cf=cfInit(); cf.ex=''; cf.no=+t.value; cf.vals=null; cf.dirty=false; cf.armed=false; pendingRender=false; render(); }
  if(t.dataset.sf==='course'){ const sf=sfInit(); sf.course=t.value; sf.vals=null; sf.dirty=false; sf.armed=false; pendingRender=false; render(); }
  if(t.dataset.rf==='course'){ const rf=rfInit(); rf.course=t.value; rf.vals=null; pendingRender=false; render(); }
});
app.addEventListener('focusout',()=>{ setTimeout(()=>{ const a=document.activeElement; if(pendingRender&&!(a&&app.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))){ pendingRender=false; render(); } },0); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&S.xconfirm){ S.xconfirm=null; render(); } });
tabs.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]'); if(!t) return;
  if(t.dataset.tab==='quiz') startQuiz('daily'); else go(t.dataset.tab);
});
render();
})();
</script>
