<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#14213d;--mute:#5a6275;--blue:#2b50aa;--line:#c9d0de;--ok:#1f7a4d;--okbg:#e2f4ea;--bad:#b3261e;--badbg:#fbe7e5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#0f1524;--card:#18203a;--ink:#e8ecf6;--mute:#9aa5c0;--blue:#8fb0ff;--line:#33406a;--ok:#6fdc9f;--okbg:#14382a;--bad:#ff9a92;--badbg:#401c1a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Kalpurush","Nikosh","Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:27px;margin:8px 0 4px;line-height:1.3}h2{font-size:19px;margin:0 0 10px}
.sub{color:var(--mute);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:700;margin:12px 0 6px}
select,input{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.seg{display:flex;gap:8px}.seg button{flex:1;padding:10px 6px}
button{font:inherit;cursor:pointer;border-radius:10px;padding:12px 16px;border:1.5px solid var(--blue);background:transparent;color:var(--blue);font-weight:700}
button.on,button.primary{background:var(--blue);color:var(--bg)}
button.primary{width:100%;margin-top:16px;padding:14px}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:15px;margin-bottom:10px}
.q{font-size:18px;font-weight:700;margin:0 0 10px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin-bottom:8px;padding:10px 12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-weight:400}
.opt .b{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--blue);display:grid;place-items:center;font-weight:700;color:var(--blue);font-size:14px}
.opt.sel .b{background:var(--blue);color:var(--bg)}
.mock{padding:14px 0;border-bottom:1px solid var(--line)}.mock:last-of-type{border:0}
.demo{background:var(--okbg);border-radius:10px;padding:12px;margin:12px 0;font-size:15px}.demo b{font-size:24px;letter-spacing:4px;display:block}
.err{color:var(--bad);margin:8px 0 0;min-height:1.4em}
.score{font-size:48px;font-weight:700;margin:0;line-height:1.2}
.row{display:flex;gap:8px}.row>*{flex:1}
.stat{border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.tip{border-left:4px solid var(--blue);padding:4px 12px;color:var(--mute);margin:12px 0}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--blue)}
.h{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.link{border:0;padding:4px;font-weight:600}
</style>
</head>

<main id="app"></main>
